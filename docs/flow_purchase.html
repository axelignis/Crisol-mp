<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crisol — Flujo Compra Completa</title>
<style>
  body { font-family: sans-serif; background: #f9f9f7; color: #3d3d3a; margin: 0; padding: 24px; }
  h1 { font-size: 20px; font-weight: 500; margin-bottom: 4px; }
  p  { font-size: 13px; color: #73726c; margin: 0 0 20px; }
  .wrap { background: #fff; border: 1px solid #e0dfda; border-radius: 12px; padding: 16px; }
  .wrap svg { width: 100%; height: auto; }

  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
  .t  { font-family: sans-serif; font-size: 14px; font-weight: 400; fill: #2c2c2a; }
  .th { font-family: sans-serif; font-size: 14px; font-weight: 500; fill: #2c2c2a; }
  .ts { font-family: sans-serif; font-size: 12px; font-weight: 400; fill: #73726c; }

  .c-purple rect { fill: #eeedfe; stroke: #534ab7; }
  .c-purple .th, .c-purple .t { fill: #3c3489; }
  .c-purple .ts { fill: #534ab7; }

  .c-teal rect { fill: #e1f5ee; stroke: #0f6e56; }
  .c-teal .th, .c-teal .t { fill: #085041; }
  .c-teal .ts { fill: #0f6e56; }

  .c-amber rect { fill: #faeeda; stroke: #ba7517; }
  .c-amber .th, .c-amber .t { fill: #633806; }
  .c-amber .ts { fill: #854f0b; }

  .c-gray rect { fill: #f1efe8; stroke: #5f5e5a; }
  .c-gray .th, .c-gray .t { fill: #444441; }
  .c-gray .ts { fill: #5f5e5a; }

  .c-coral rect { fill: #faece7; stroke: #993c1d; }
  .c-coral .th, .c-coral .t { fill: #712b13; }
  .c-coral .ts { fill: #993c1d; }

  .node { cursor: pointer; }
  .node:hover rect { opacity: 0.85; }

  @media (prefers-color-scheme: dark) {
    body { background: #1e1e1c; color: #c2c0b6; }
    .wrap { background: #2a2a28; border-color: #3a3a38; }
    h1 { color: #e8e6dc; }
    p { color: #9c9a92; }
    .th, .t { fill: #c2c0b6; }
    .ts { fill: #888780; }
    .arr { stroke: #5f5e5a; }
    .c-purple rect { fill: #26215c; stroke: #afa9ec; }
    .c-purple .th, .c-purple .t { fill: #cecbf6; }
    .c-purple .ts { fill: #afa9ec; }
    .c-teal rect { fill: #04342c; stroke: #5dcaa5; }
    .c-teal .th, .c-teal .t { fill: #9fe1cb; }
    .c-teal .ts { fill: #5dcaa5; }
    .c-amber rect { fill: #412402; stroke: #ef9f27; }
    .c-amber .th, .c-amber .t { fill: #fac775; }
    .c-amber .ts { fill: #ef9f27; }
    .c-gray rect { fill: #2c2c2a; stroke: #b4b2a9; }
    .c-gray .th, .c-gray .t { fill: #d3d1c7; }
    .c-gray .ts { fill: #b4b2a9; }
    .c-coral rect { fill: #4a1b0c; stroke: #f0997b; }
    .c-coral .th, .c-coral .t { fill: #f5c4b3; }
    .c-coral .ts { fill: #f0997b; }
  }
</style>
</head>
<body>
<h1>Crisol — Flujo 1: Compra completa</h1>
<p>Desde la selección de variante hasta la confirmación del pedido, incluyendo descuentos, pago y notificaciones</p>
<div class="wrap">
<svg width="100%" viewBox="0 0 680 870" role="img">
  <title>Flujo de compra completa — Crisol</title>
  <desc>Proceso completo desde carrito hasta pedido confirmado incluyendo checkout, pago y notificaciones</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g class="c-gray">
    <rect x="280" y="30" width="140" height="36" rx="18" stroke-width="0.5"/>
    <text class="th" x="350" y="48" text-anchor="middle" dominant-baseline="central">inicio</text>
  </g>
  <line x1="350" y1="66" x2="350" y2="110" class="arr" marker-end="url(#arr)"/>

  <g class="node c-purple">
    <rect x="230" y="110" width="220" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="132" text-anchor="middle" dominant-baseline="central">Seleccionar variante</text>
  </g>
  <line x1="340" y1="154" x2="340" y2="198" class="arr" marker-end="url(#arr)"/>

  <g class="node c-purple">
    <rect x="230" y="198" width="220" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="220" text-anchor="middle" dominant-baseline="central">Dirección + cotización courier</text>
  </g>
  <line x1="340" y1="242" x2="340" y2="280" class="arr" marker-end="url(#arr)"/>

  <g class="node c-amber">
    <rect x="245" y="280" width="190" height="40" rx="4" stroke-width="0.5"/>
    <text class="th" x="340" y="300" text-anchor="middle" dominant-baseline="central">¿cupón o puntos?</text>
  </g>

  <path d="M245,300 L205,300" fill="none" class="arr" marker-end="url(#arr)"/>
  <text class="ts" x="224" y="292" text-anchor="middle">Sí</text>

  <g class="node c-teal">
    <rect x="50" y="278" width="155" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="127" y="300" text-anchor="middle" dominant-baseline="central">Aplicar descuento</text>
  </g>
  <path d="M127,322 L127,392 L230,392" fill="none" class="arr" marker-end="url(#arr)"/>

  <line x1="340" y1="320" x2="340" y2="370" class="arr" marker-end="url(#arr)"/>
  <text class="ts" x="354" y="346" text-anchor="start">No</text>

  <g class="node c-purple">
    <rect x="230" y="370" width="220" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="392" text-anchor="middle" dominant-baseline="central">Resumen y confirmación</text>
  </g>
  <line x1="340" y1="414" x2="340" y2="458" class="arr" marker-end="url(#arr)"/>

  <g class="node c-purple">
    <rect x="230" y="458" width="220" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="480" text-anchor="middle" dominant-baseline="central">Seleccionar pago y pagar</text>
  </g>
  <line x1="340" y1="502" x2="340" y2="546" class="arr" marker-end="url(#arr)"/>

  <g class="node c-amber">
    <rect x="245" y="546" width="190" height="40" rx="4" stroke-width="0.5"/>
    <text class="th" x="340" y="566" text-anchor="middle" dominant-baseline="central">¿pago aprobado?</text>
  </g>

  <path d="M435,566 L476,566" fill="none" class="arr" marker-end="url(#arr)"/>
  <text class="ts" x="454" y="558" text-anchor="middle">No</text>

  <g class="c-coral">
    <rect x="476" y="544" width="155" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="553" y="562" text-anchor="middle" dominant-baseline="central">Error de pago</text>
    <text class="ts" x="553" y="578" text-anchor="middle" dominant-baseline="central">→ reintentar</text>
  </g>

  <line x1="340" y1="586" x2="340" y2="636" class="arr" marker-end="url(#arr)"/>
  <text class="ts" x="354" y="612" text-anchor="start">Sí</text>

  <g class="node c-purple">
    <rect x="230" y="636" width="220" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="658" text-anchor="middle" dominant-baseline="central">Crear pedido + split payment</text>
  </g>
  <line x1="340" y1="680" x2="340" y2="724" class="arr" marker-end="url(#arr)"/>

  <g class="node c-purple">
    <rect x="230" y="724" width="220" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="746" text-anchor="middle" dominant-baseline="central">Notificar + sumar puntos</text>
  </g>
  <line x1="340" y1="768" x2="340" y2="808" class="arr" marker-end="url(#arr)"/>

  <g class="c-teal">
    <rect x="245" y="808" width="190" height="36" rx="18" stroke-width="0.5"/>
    <text class="th" x="340" y="826" text-anchor="middle" dominant-baseline="central">pedido confirmado</text>
  </g>
</svg>
</div>
</body>
</html>
