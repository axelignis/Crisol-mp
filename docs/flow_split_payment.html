<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crisol — Flujo Split Payment</title>
<style>
  body { font-family: sans-serif; background: #f9f9f7; color: #3d3d3a; margin: 0; padding: 24px; }
  h1 { font-size: 20px; font-weight: 500; margin-bottom: 4px; }
  p  { font-size: 13px; color: #73726c; margin: 0 0 20px; }
  .wrap { background: #fff; border: 1px solid #e0dfda; border-radius: 12px; padding: 16px; }
  .wrap svg { width: 100%; height: auto; }

  /* Pre-built SVG classes */
  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
  .box { fill: #f1efe8; stroke: #b4b2a9; stroke-width: 0.5; }
  .t  { font-family: sans-serif; font-size: 14px; font-weight: 400; fill: #2c2c2a; }
  .th { font-family: sans-serif; font-size: 14px; font-weight: 500; fill: #2c2c2a; }
  .ts { font-family: sans-serif; font-size: 12px; font-weight: 400; fill: #73726c; }

  .c-purple rect, .c-purple circle, .c-purple ellipse { fill: #eeedfe; stroke: #534ab7; }
  .c-purple .th, .c-purple .t { fill: #3c3489; }
  .c-purple .ts { fill: #534ab7; }

  .c-teal rect, .c-teal circle, .c-teal ellipse { fill: #e1f5ee; stroke: #0f6e56; }
  .c-teal .th, .c-teal .t { fill: #085041; }
  .c-teal .ts { fill: #0f6e56; }

  .c-blue rect, .c-blue circle, .c-blue ellipse { fill: #e6f1fb; stroke: #185fa5; }
  .c-blue .th, .c-blue .t { fill: #0c447c; }
  .c-blue .ts { fill: #185fa5; }

  .c-amber rect, .c-amber circle, .c-amber ellipse { fill: #faeeda; stroke: #ba7517; }
  .c-amber .th, .c-amber .t { fill: #633806; }
  .c-amber .ts { fill: #854f0b; }

  .c-gray rect, .c-gray circle, .c-gray ellipse { fill: #f1efe8; stroke: #5f5e5a; }
  .c-gray .th, .c-gray .t { fill: #444441; }
  .c-gray .ts { fill: #5f5e5a; }

  .c-coral rect, .c-coral circle, .c-coral ellipse { fill: #faece7; stroke: #993c1d; }
  .c-coral .th, .c-coral .t { fill: #712b13; }
  .c-coral .ts { fill: #993c1d; }

  .node { cursor: pointer; }
  .node:hover rect, .node:hover circle { opacity: 0.85; }

  @media (prefers-color-scheme: dark) {
    body { background: #1e1e1c; color: #c2c0b6; }
    .wrap { background: #2a2a28; border-color: #3a3a38; }
    h1 { color: #e8e6dc; }
    p { color: #9c9a92; }
    .th, .t { fill: #c2c0b6; }
    .ts { fill: #888780; }
    .c-purple rect, .c-purple circle, .c-purple ellipse { fill: #26215c; stroke: #afa9ec; }
    .c-purple .th, .c-purple .t { fill: #cecbf6; }
    .c-purple .ts { fill: #afa9ec; }
    .c-teal rect, .c-teal circle, .c-teal ellipse { fill: #04342c; stroke: #5dcaa5; }
    .c-teal .th, .c-teal .t { fill: #9fe1cb; }
    .c-teal .ts { fill: #5dcaa5; }
    .c-blue rect, .c-blue circle, .c-blue ellipse { fill: #042c53; stroke: #85b7eb; }
    .c-blue .th, .c-blue .t { fill: #b5d4f4; }
    .c-blue .ts { fill: #85b7eb; }
    .c-amber rect, .c-amber circle, .c-amber ellipse { fill: #412402; stroke: #ef9f27; }
    .c-amber .th, .c-amber .t { fill: #fac775; }
    .c-amber .ts { fill: #ef9f27; }
    .c-gray rect, .c-gray circle, .c-gray ellipse { fill: #2c2c2a; stroke: #b4b2a9; }
    .c-gray .th, .c-gray .t { fill: #d3d1c7; }
    .c-gray .ts { fill: #b4b2a9; }
    .c-coral rect, .c-coral circle, .c-coral ellipse { fill: #4a1b0c; stroke: #f0997b; }
    .c-coral .th, .c-coral .t { fill: #f5c4b3; }
    .c-coral .ts { fill: #f0997b; }
    .arr { stroke: #5f5e5a; }
  }
</style>
</head>
<body>
<h1>Crisol — Flujo 3: Split payment automático</h1>
<p>Distribución de fondos desde el pago del comprador hasta la transferencia al artesano y acreditación de puntos</p>
<div class="wrap">
<svg width="100%" viewBox="0 0 680 810" role="img">
  <title>Flujo de split payment — Crisol</title>
  <desc>Distribución automática de fondos desde el pago del comprador hasta la transferencia al artesano y acreditación de puntos</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g class="c-gray">
    <rect x="260" y="30" width="170" height="36" rx="18" stroke-width="0.5"/>
    <text class="th" x="345" y="48" text-anchor="middle" dominant-baseline="central">pago iniciado</text>
  </g>
  <line x1="345" y1="66" x2="345" y2="110" class="arr" marker-end="url(#arr)"/>

  <g class="node c-blue">
    <rect x="225" y="110" width="220" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="335" y="125" text-anchor="middle" dominant-baseline="central">Stripe captura el pago</text>
    <text class="ts" x="335" y="143" text-anchor="middle" dominant-baseline="central">monto total del comprador</text>
  </g>
  <line x1="335" y1="154" x2="335" y2="198" class="arr" marker-end="url(#arr)"/>

  <g class="node c-purple">
    <rect x="225" y="198" width="220" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="335" y="213" text-anchor="middle" dominant-baseline="central">Consultar COMMISSION_CONFIG</text>
    <text class="ts" x="335" y="231" text-anchor="middle" dominant-baseline="central">calcular comisión y neto artesano</text>
  </g>
  <line x1="335" y1="242" x2="335" y2="286" class="arr" marker-end="url(#arr)"/>

  <g class="node c-blue">
    <rect x="225" y="286" width="220" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="335" y="301" text-anchor="middle" dominant-baseline="central">Stripe Transfer API</text>
    <text class="ts" x="335" y="319" text-anchor="middle" dominant-baseline="central">transferir neto al artesano</text>
  </g>
  <line x1="335" y1="330" x2="335" y2="374" class="arr" marker-end="url(#arr)"/>

  <g class="node c-purple">
    <rect x="225" y="374" width="220" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="335" y="389" text-anchor="middle" dominant-baseline="central">Registrar PAYMENT en BD</text>
    <text class="ts" x="335" y="407" text-anchor="middle" dominant-baseline="central">payment_id + transfer_id</text>
  </g>
  <line x1="335" y1="418" x2="335" y2="462" class="arr" marker-end="url(#arr)"/>

  <g class="node c-purple">
    <rect x="225" y="462" width="220" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="335" y="484" text-anchor="middle" dominant-baseline="central">ORDER → estado Pagado</text>
  </g>
  <line x1="335" y1="506" x2="335" y2="550" class="arr" marker-end="url(#arr)"/>

  <g class="node c-amber">
    <rect x="240" y="550" width="190" height="40" rx="4" stroke-width="0.5"/>
    <text class="th" x="335" y="570" text-anchor="middle" dominant-baseline="central">¿comprador con cuenta?</text>
  </g>

  <path d="M240,570 L200,570" fill="none" class="arr" marker-end="url(#arr)"/>
  <text class="ts" x="219" y="562" text-anchor="middle">Sí</text>

  <g class="node c-teal">
    <rect x="44" y="548" width="156" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="122" y="564" text-anchor="middle" dominant-baseline="central">Acreditar 1 punto</text>
    <text class="ts" x="122" y="580" text-anchor="middle" dominant-baseline="central">fidelización</text>
  </g>
  <path d="M122,592 L122,640 L225,640" fill="none" class="arr" marker-end="url(#arr)"/>

  <line x1="335" y1="590" x2="335" y2="618" class="arr" marker-end="url(#arr)"/>
  <text class="ts" x="349" y="605" text-anchor="start">No</text>

  <g class="node c-purple">
    <rect x="225" y="618" width="220" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="335" y="633" text-anchor="middle" dominant-baseline="central">Notificar al artesano</text>
    <text class="ts" x="335" y="651" text-anchor="middle" dominant-baseline="central">email + push + recibo comprador</text>
  </g>
  <line x1="335" y1="662" x2="335" y2="706" class="arr" marker-end="url(#arr)"/>

  <g class="c-teal">
    <rect x="240" y="706" width="190" height="36" rx="18" stroke-width="0.5"/>
    <text class="th" x="335" y="724" text-anchor="middle" dominant-baseline="central">fondos distribuidos</text>
  </g>
</svg>
</div>
</body>
</html>
