<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crisol — Flujo Publicación de Pieza</title>
<style>
  body { font-family: sans-serif; background: #f9f9f7; color: #3d3d3a; margin: 0; padding: 24px; }
  h1 { font-size: 20px; font-weight: 500; margin-bottom: 4px; }
  p  { font-size: 13px; color: #73726c; margin: 0 0 20px; }
  .wrap { background: #fff; border: 1px solid #e0dfda; border-radius: 12px; padding: 16px; }
  .wrap svg { width: 100%; height: auto; }

  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
  .t  { font-family: sans-serif; font-size: 14px; font-weight: 400; fill: #2c2c2a; }
  .th { font-family: sans-serif; font-size: 14px; font-weight: 500; fill: #2c2c2a; }
  .ts { font-family: sans-serif; font-size: 12px; font-weight: 400; fill: #73726c; }

  .c-purple rect { fill: #eeedfe; stroke: #534ab7; }
  .c-purple .th, .c-purple .t { fill: #3c3489; }
  .c-purple .ts { fill: #534ab7; }

  .c-teal rect { fill: #e1f5ee; stroke: #0f6e56; }
  .c-teal .th, .c-teal .t { fill: #085041; }
  .c-teal .ts { fill: #0f6e56; }

  .c-amber rect { fill: #faeeda; stroke: #ba7517; }
  .c-amber .th, .c-amber .t { fill: #633806; }
  .c-amber .ts { fill: #854f0b; }

  .c-gray rect { fill: #f1efe8; stroke: #5f5e5a; }
  .c-gray .th, .c-gray .t { fill: #444441; }
  .c-gray .ts { fill: #5f5e5a; }

  .c-coral rect { fill: #faece7; stroke: #993c1d; }
  .c-coral .th, .c-coral .t { fill: #712b13; }
  .c-coral .ts { fill: #993c1d; }

  .node { cursor: pointer; }
  .node:hover rect { opacity: 0.85; }

  @media (prefers-color-scheme: dark) {
    body { background: #1e1e1c; color: #c2c0b6; }
    .wrap { background: #2a2a28; border-color: #3a3a38; }
    h1 { color: #e8e6dc; }
    p { color: #9c9a92; }
    .th, .t { fill: #c2c0b6; }
    .ts { fill: #888780; }
    .arr { stroke: #5f5e5a; }
    .c-purple rect { fill: #26215c; stroke: #afa9ec; }
    .c-purple .th, .c-purple .t { fill: #cecbf6; }
    .c-purple .ts { fill: #afa9ec; }
    .c-teal rect { fill: #04342c; stroke: #5dcaa5; }
    .c-teal .th, .c-teal .t { fill: #9fe1cb; }
    .c-teal .ts { fill: #5dcaa5; }
    .c-amber rect { fill: #412402; stroke: #ef9f27; }
    .c-amber .th, .c-amber .t { fill: #fac775; }
    .c-amber .ts { fill: #ef9f27; }
    .c-gray rect { fill: #2c2c2a; stroke: #b4b2a9; }
    .c-gray .th, .c-gray .t { fill: #d3d1c7; }
    .c-gray .ts { fill: #b4b2a9; }
    .c-coral rect { fill: #4a1b0c; stroke: #f0997b; }
    .c-coral .th, .c-coral .t { fill: #f5c4b3; }
    .c-coral .ts { fill: #f0997b; }
  }
</style>
</head>
<body>
<h1>Crisol — Flujo 2: Publicación de pieza</h1>
<p>Desde que el artesano crea una pieza hasta que aparece publicada en el catálogo público</p>
<div class="wrap">
<svg width="100%" viewBox="0 0 680 770" role="img">
  <title>Flujo de publicación de pieza — Crisol</title>
  <desc>Proceso desde que el artesano crea una pieza hasta que aparece publicada en el catálogo, incluyendo revisión y aprobación del administrador</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g class="c-gray">
    <rect x="265" y="30" width="160" height="36" rx="18" stroke-width="0.5"/>
    <text class="th" x="345" y="48" text-anchor="middle" dominant-baseline="central">artesano en su panel</text>
  </g>
  <line x1="345" y1="66" x2="345" y2="110" class="arr" marker-end="url(#arr)"/>

  <g class="node c-purple">
    <rect x="225" y="110" width="220" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="335" y="130" text-anchor="middle" dominant-baseline="central">Completa formulario</text>
    <text class="ts" x="335" y="150" text-anchor="middle" dominant-baseline="central">variantes, precio, descripción</text>
  </g>
  <line x1="335" y1="166" x2="335" y2="210" class="arr" marker-end="url(#arr)"/>

  <g class="node c-purple">
    <rect x="225" y="210" width="220" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="335" y="230" text-anchor="middle" dominant-baseline="central">Sube multimedia</text>
    <text class="ts" x="335" y="250" text-anchor="middle" dominant-baseline="central">fotos, video y modelo 3D</text>
  </g>
  <line x1="335" y1="266" x2="335" y2="310" class="arr" marker-end="url(#arr)"/>

  <g class="node c-purple">
    <rect x="225" y="310" width="220" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="335" y="332" text-anchor="middle" dominant-baseline="central">Envía a revisión</text>
  </g>
  <line x1="335" y1="354" x2="335" y2="398" class="arr" marker-end="url(#arr)"/>

  <g class="node c-gray">
    <rect x="225" y="398" width="220" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="335" y="418" text-anchor="middle" dominant-baseline="central">Admin notificado</text>
    <text class="ts" x="335" y="438" text-anchor="middle" dominant-baseline="central">cola de moderación</text>
  </g>
  <line x1="335" y1="454" x2="335" y2="498" class="arr" marker-end="url(#arr)"/>

  <g class="node c-amber">
    <rect x="240" y="498" width="190" height="40" rx="4" stroke-width="0.5"/>
    <text class="th" x="335" y="518" text-anchor="middle" dominant-baseline="central">¿admin aprueba?</text>
  </g>

  <path d="M240,518 L200,518" fill="none" class="arr" marker-end="url(#arr)"/>
  <text class="ts" x="219" y="510" text-anchor="middle">No</text>

  <g class="c-coral">
    <rect x="44" y="496" width="156" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="122" y="516" text-anchor="middle" dominant-baseline="central">Devuelta con notas</text>
    <text class="ts" x="122" y="534" text-anchor="middle" dominant-baseline="central">artesano corrige ↩</text>
  </g>

  <line x1="335" y1="538" x2="335" y2="586" class="arr" marker-end="url(#arr)"/>
  <text class="ts" x="349" y="563" text-anchor="start">Sí</text>

  <g class="node c-teal">
    <rect x="225" y="586" width="220" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="335" y="606" text-anchor="middle" dominant-baseline="central">Publicar en catálogo</text>
    <text class="ts" x="335" y="624" text-anchor="middle" dominant-baseline="central">regenerar página ISR</text>
  </g>
  <line x1="335" y1="642" x2="335" y2="686" class="arr" marker-end="url(#arr)"/>

  <g class="node c-purple">
    <rect x="225" y="686" width="220" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="335" y="706" text-anchor="middle" dominant-baseline="central">Notificar artesano</text>
    <text class="ts" x="335" y="724" text-anchor="middle" dominant-baseline="central">+ alertar seguidores</text>
  </g>
  <line x1="335" y1="742" x2="335" y2="754" class="arr" marker-end="url(#arr)"/>

  <g class="c-teal">
    <rect x="240" y="754" width="190" height="36" rx="18" stroke-width="0.5"/>
    <text class="th" x="335" y="772" text-anchor="middle" dominant-baseline="central">pieza visible en catálogo</text>
  </g>
</svg>
</div>
</body>
</html>
